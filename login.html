<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Al-QURANITE</title>

    <!-- SECURE CSP -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self'; 
      script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
      style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com; 
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; 
      img-src 'self' data: https:; 
      connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://txdmbluqqgjnbzawqogu.supabase.co">
        
    <link rel="icon" href="images/favicon.ico" type="image/x-icon"> 

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-t4GWSVZO1eC8BM339Xd7Uphw5s17a86tIZIj8qRxhnKub6WoyhnrxeCIMeAqBPgdZGlCcG2PrZjMc+Wr78+5Xg==" crossorigin="anonymous"> 

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="css/styles.css"> 
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-kaaba me-2"></i> Al-QURANITE</a>
        </div>
    </nav>

    <div class="container login-container">
        <!-- Loading Overlay -->
        <div id="sessionLoader" class="text-center w-100 py-5">
            <div class="spinner-border text-emerald" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted small">Checking session...</p>
        </div>
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <i class="fas fa-lock fa-3x text-emerald"></i>
                <h3 class="serif-heading mt-2">Admin Access</h3>
                <p class="text-muted small">Sign in to manage content</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label text-muted small fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="admin@alquranite.com" required autocomplete="email" />
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password field with toggle visibility -->
                <div class="mb-3">
                    <label for="password" class="form-label text-muted small fw-bold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="new-password" />
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" tabindex="-1">
                            <i class="far fa-eye" id="togglePasswordIcon"></i>
                        </button>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                </div>

                <!-- Forgot Password Link -->
                <div class="d-flex justify-content-end mb-3">
                    <a href="#" class="text-muted small" id="forgotPasswordLink">Forgot password?</a>
                </div>

                <div id="loginError" class="alert alert-danger small d-none"></div>

                <button type="submit" class="btn btn-submit w-100" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="index.html" class="text-muted small">← Back to site</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main Scripts -->
    <script src="js/admin-login.js" type="module"></script>

</body>
</html>
