<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Al-QURANITE</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;">

    <link rel="icon" href="/Al-Quranite/images/favicon.ico" type="image/x-icon">  
    
    <!-- Same styles as main site -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-kaaba me-2"></i> Al-QURANITE</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 120px; max-width: 500px;">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <i class="fas fa-lock fa-3x text-emerald"></i>
                <h3 class="serif-heading mt-2">Admin Access</h3>
                <p class="text-muted small">Sign in to manage content</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted small fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="admin@alquranite.com" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-muted small fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required />
                </div>
                <div id="loginError" class="text-danger small mb-2" style="display:none;"></div>
                <button type="submit" class="btn btn-submit w-100" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="index.html" class="text-muted small">← Back to site</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('loginError');
        const submitBtn = document.getElementById('loginBtn');

        // Check if already logged in – redirect to admin
        (async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'admin.html';
            }
        })();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Signing in...';

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password,
            });

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In';

            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                return;
            }

            // Success – redirect to admin page
            window.location.href = 'admin.html';
        });
    </script>
</body>
</html>
